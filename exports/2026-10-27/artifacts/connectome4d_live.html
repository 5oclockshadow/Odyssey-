<title>4D Connectome</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a one-screen 4D brain — full-bleed canvas with a floating control rail + node panel. Single deliberate neon-dark world. */
  :root{
    --bg:#070b11; --panel:#0e141ccc; --line:#1d2a3a; --fg:#dbe8fb; --dim:#7b8ca3; --neon:#39ff88; --neon2:#4fd6ff;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden;}
  #c{display:block;width:100%;height:100%;cursor:grab;}
  #c:active{cursor:grabbing;}
  .rail{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#070b11ee,#070b1100);z-index:5;pointer-events:none;}
  .rail>*{pointer-events:auto;}
  .brand{color:var(--neon);font-weight:600;letter-spacing:.05em;font-size:14px;}
  .tag{color:var(--dim);font-size:11px;}
  .rail .grow{flex:1;}
  button,select{font:inherit;font-size:12px;background:#121a24;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;}
  button:hover{border-color:var(--neon);}
  input[type=range]{accent-color:var(--neon);width:90px;vertical-align:middle;}
  label.ctl{font-size:11px;color:var(--dim);display:inline-flex;gap:6px;align-items:center;}
  .panel{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:58px;width:230px;max-width:60vw;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(6px);z-index:5;}
  .panel .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon2);}
  .panel .v{font-size:13px;margin:2px 0 10px;word-break:break-all;}
  .legend{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px);z-index:5;max-width:70vw;}
  .legend b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px;}
  .legend span{display:inline-flex;gap:5px;align-items:center;font-size:11px;color:var(--dim);margin:2px 9px 2px 0;cursor:pointer;}
  .legend span.off{opacity:.3;text-decoration:line-through;}
  .dot{width:9px;height:9px;border-radius:50%;}
  .hud{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:56px;font-size:11px;color:var(--dim);z-index:4;}
  @media(max-width:560px){.panel{display:none;}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">

<canvas id="c"></canvas>
<div class="rail">
  <span class="brand">4D Connectome</span>
  <span class="tag">rotation across xy · xz · xw · yz · yw · zw</span>
  <span class="grow"></span>
  <label class="ctl">nodes <input id="count" type="range" min="80" max="900" step="20" value="420"></label>
  <label class="ctl">spin <input id="spin" type="range" min="0" max="3" step="0.1" value="1"></label>
  <button id="reset">reset view</button>
</div>
<div class="hud" id="hud"></div>
<div class="panel" id="panel"><div class="k">selected</div><div class="v" id="pv">drag to orbit · wheel to zoom · click a node</div>
  <div class="k">archetype</div><div class="v" id="pa">—</div>
  <div class="k">degree</div><div class="v" id="pd">—</div>
  <div class="k">neighbors</div><div class="v" id="pn" style="color:var(--dim);font-size:12px;">click a node to trace its 1-hop subgraph</div></div>
<div class="legend" id="legend"><b>archetypes · click to filter</b><div id="legrow"></div></div>

<script>
const ARCHE={repo:"#4fd6ff",dep:"#f6c945",topic:"#39ff88",code:"#b58cff",lang:"#ff8fb0",file:"#5ad1c4",service:"#ffa94d",raptor:"#e06bff",user:"#ff5d7a"};
const AK=Object.keys(ARCHE);
function rng(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}

// --- build a realistic "brain": a user hub, repo clusters, each with code/file/dep/topic children, raptor summaries over clusters ---
function buildGraph(N){
  const R=rng(42),nodes=[],edges=[];
  const add=(id,arche)=>{nodes.push({id,archetype:arche,degree:0});return nodes.length-1;};
  const link=(a,b)=>{edges.push([a,b]);nodes[a].degree++;nodes[b].degree++;};
  const user=add("5oclockshadow","user");
  const nClusters=Math.max(4,Math.round(N/55));
  let made=1;
  for(let c=0;c<nClusters && made<N;c++){
    const repo=add("repo/"+["odyssey","codegen-v3","tendergraph","appbuilder","broadcaster","thor","mcpagents","openbb-bot"][c%8]+(c>7?c:""),"repo");
    link(user,repo);
    const raptor=add("raptor:L1-"+c,"raptor");link(repo,raptor);
    const topic=add("topic/"+["graph","dspy","agent","saas","media","bidding","router","soc2"][c%8],"topic");link(repo,topic);
    const kids=6+Math.floor(R()*10);
    let prev=repo;
    for(let k=0;k<kids && made<N;k++){
      const kind=["code","file","dep","service","lang"][Math.floor(R()*5)];
      const n=add(kind+"/"+c+"-"+k,kind);link(repo,n);link(raptor,n);
      if(R()<0.5)link(prev,n);prev=n;made++;
      if(R()<0.25)link(n,topic);
    }
    made+=3;
    if(c>0 && R()<0.5)link(repo,1+Math.floor(R()*(nodes.length-1))); // cross-links
  }
  return {nodes,edges};
}

// --- 4D renderer ---
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let G,pos,ang={xy:0,xz:0,xw:0,yz:0,yw:0,zw:0},zoom=1,sel=-1,hover=-1,spin=1,off=new Set();
const PLANES={xy:[0,1],xz:[0,2],xw:[0,3],yz:[1,2],yw:[1,3],zw:[2,3]};
function rot(p,pl,a){const c=Math.cos(a),s=Math.sin(a),i=pl[0],j=pl[1],vi=p[i],vj=p[j];p[i]=vi*c-vj*s;p[j]=vi*s+vj*c;}
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}

function layout(){
  const n=G.nodes.length;pos=new Array(n);
  for(let i=0;i<n;i++){const r=rng(hash(G.nodes[i].id)||i+1);let u=r()*2-1,v=r()*2-1,p=r()*2-1,q=r()*2-1;const L=Math.hypot(u,v,p,q)||1;pos[i]=[u/L,v/L,p/L,q/L];}
  for(let it=0;it<10;it++)for(const e of G.edges){const a=e[0],b=e[1];for(let d=0;d<4;d++){const m=(pos[a][d]+pos[b][d])/2;pos[a][d]+=(m-pos[a][d])*0.09;pos[b][d]+=(m-pos[b][d])*0.09;}}
}
function project(p){const q=p.slice();rot(q,PLANES.xy,ang.xy);rot(q,PLANES.xz,ang.xz);rot(q,PLANES.xw,ang.xw);rot(q,PLANES.yz,ang.yz);rot(q,PLANES.yw,ang.yw);rot(q,PLANES.zw,ang.zw);
  const w4=2.4/(2.7-q[3]),x3=q[0]*w4,y3=q[1]*w4,z3=q[2]*w4,w3=2.2/(2.7-z3),W=canvas.width,H=canvas.height,S=Math.min(W,H)*0.36*zoom;
  return {x:W/2+x3*w3*S,y:H/2+y3*w3*S,depth:(w4+w3)*0.5};}
let drag=null;const neigh=new Set();
function render(){
  const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle="#070b11";ctx.fillRect(0,0,W,H);
  const P=pos.map(project),vis=i=>!off.has(G.nodes[i].archetype);
  ctx.lineWidth=1;
  for(const e of G.edges){if(!vis(e[0])||!vis(e[1]))continue;const a=P[e[0]],b=P[e[1]];
    const hot=sel>=0&&(e[0]===sel||e[1]===sel);
    const al=hot?0.8:Math.max(0.03,Math.min(0.18,(a.depth+b.depth)*0.05));
    ctx.strokeStyle=hot?"rgba(57,255,136,"+al+")":"rgba(90,130,170,"+al.toFixed(3)+")";
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  const order=P.map((p,i)=>i).filter(vis).sort((i,j)=>P[i].depth-P[j].depth);
  for(const i of order){const p=P[i],nd=G.nodes[i],col=ARCHE[nd.archetype]||"#7b8ca3";
    const on=i===sel||i===hover||neigh.has(i);const r=Math.max(1.4,(1.8+Math.sqrt(nd.degree+1)*0.9)*p.depth*0.5*zoom);
    ctx.globalAlpha=sel>=0&&!on?0.18:Math.max(0.3,Math.min(1,p.depth*0.6));
    ctx.beginPath();ctx.arc(p.x,p.y,on?r*1.7:r,0,6.2832);ctx.fillStyle=col;ctx.fill();
    if(i===sel||i===hover){ctx.globalAlpha=1;ctx.strokeStyle="#fff";ctx.lineWidth=1.4;ctx.stroke();
      ctx.fillStyle="#dbe8fb";ctx.font="12px var(--mono),monospace";ctx.fillText(nd.id,p.x+9,p.y-9);}}
  ctx.globalAlpha=1;
}
function tick(){if(!drag){ang.yw+=0.0016*spin;ang.zw+=0.0010*spin;ang.xz+=0.0006*spin;}render();requestAnimationFrame(tick);}
function pick(mx,my){let best=-1,bd=16*16;for(let i=0;i<G.nodes.length;i++){if(off.has(G.nodes[i].archetype))continue;const p=project(pos[i]),dx=p.x-mx,dy=p.y-my,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}return best;}
function selectNode(i){sel=i;neigh.clear();const nd=G.nodes[i];const ns=[];
  for(const e of G.edges){if(e[0]===i){neigh.add(e[1]);ns.push(G.nodes[e[1]].id);}else if(e[1]===i){neigh.add(e[0]);ns.push(G.nodes[e[0]].id);}}
  document.getElementById("pv").textContent=nd.id;document.getElementById("pa").textContent=nd.archetype;
  document.getElementById("pd").textContent=nd.degree;document.getElementById("pn").textContent=ns.slice(0,12).join(", ")||"(leaf)";}

function sizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight;}
addEventListener("resize",sizeCanvas);sizeCanvas();
canvas.addEventListener("mousedown",e=>drag={x:e.clientX,y:e.clientY,moved:false});
addEventListener("mouseup",e=>{if(drag&&!drag.moved){const i=pick(e.clientX,e.clientY);if(i>=0)selectNode(i);}drag=null;});
addEventListener("mousemove",e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
    ang.yw+=dx*0.005;ang.zw+=dx*0.002;ang.xz+=dy*0.005;ang.xw+=dy*0.002;drag.x=e.clientX;drag.y=e.clientY;}
  else hover=pick(e.clientX,e.clientY);});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(0.3,Math.min(6,zoom*(e.deltaY<0?1.1:0.9)));},{passive:false});
// touch
canvas.addEventListener("touchstart",e=>{drag={x:e.touches[0].clientX,y:e.touches[0].clientY,moved:false};},{passive:true});
canvas.addEventListener("touchmove",e=>{if(!drag)return;const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;drag.moved=true;
   ang.yw+=dx*0.006;ang.xz+=dy*0.006;drag.x=t.clientX;drag.y=t.clientY;},{passive:true});
canvas.addEventListener("touchend",()=>{drag=null;},{passive:true});

function rebuild(){G=buildGraph(+document.getElementById("count").value);layout();sel=-1;neigh.clear();
  document.getElementById("hud").textContent=G.nodes.length+" nodes · "+G.edges.length+" edges · 4D";}
document.getElementById("count").oninput=rebuild;
document.getElementById("spin").oninput=e=>spin=+e.target.value;
document.getElementById("reset").onclick=()=>{ang={xy:0,xz:0,xw:0,yz:0,yw:0,zw:0};zoom=1;sel=-1;neigh.clear();};
// legend
const lr=document.getElementById("legrow");
AK.forEach(k=>{const s=document.createElement("span");s.innerHTML='<span class="dot" style="background:'+ARCHE[k]+'"></span>'+k;
  s.onclick=()=>{if(off.has(k)){off.delete(k);s.classList.remove("off");}else{off.add(k);s.classList.add("off");}};lr.appendChild(s);});

rebuild();tick();
</script>
