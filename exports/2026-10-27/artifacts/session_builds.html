<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odyssey Empire</title>
<style>
  :root{--bg:#070b11;--text:#eaf2ff;--acc:#39ff9f;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;}
  :root:not([data-theme="light"]){color-scheme:dark;}
  .bar{position:fixed;top:0;left:0;right:0;min-height:46px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 14px;border-bottom:1px solid #1a2740;background:#0a0f17;z-index:10;}
  .bar b{color:var(--acc);} .bar .t{font-weight:600;font-size:15px;} .bar span{font-size:12px;color:#8aa0bd;}
  .bar .btn{margin-left:auto;display:flex;gap:6px;}
  .bar button{background:#0e1725;border:1px solid #1a2740;color:#cfe0f5;font:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;}
  .bar button:hover{border-color:var(--acc);}
  #mm{position:fixed;inset:54px 0 0 0;width:100%;height:calc(100% - 54px);}
  svg.markmap{width:100%;height:100%;font-size:16px;}
  svg.markmap .markmap-foreign{color:#eaf2ff;font-size:15px;line-height:1.3;}
  svg.markmap .markmap-foreign div{color:#eaf2ff !important;font-weight:500;}
  svg.markmap .markmap-foreign code{color:#9ae9ff !important;background:#0e1725;padding:0 4px;border-radius:4px;}
</style>
</head>
<body>
<div class="bar"><b>◆</b><span class="t">Odyssey — Empire Map</span><span>Jarvis › Institute › everything · top to low · tap a node · scroll to zoom</span>
  <span class="btn"><button id="ex">Expand all</button><button id="co">Collapse</button><button id="fit">Fit</button></span></div>
<div id="mm"><svg class="markmap"></svg></div>
<script>window.markmap={autoLoader:{manual:true}};</script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.18.10/dist/index.js"></script>
<script type="text/markdown" id="src">
# Odyssey
## ① Jarvis — personal copilot & orchestrator `TOP`
- your assistant; sits above and drives the Institute
- approves · delegates · watches · steps in where a human is needed
- runs on the shared Codegen engine + the fleet
## ② The Threshold Institute — the platform `above everything`
- self-running think tank · your baby & daily job
- one agent = one graph (every span, log, fn, app, incident, patch → nodes)
- one Signature (one input field, one output field)
- reads all its own source, edits none — proposes upgrades you approve
- manages all SaaS + research
### core engine
- DSPy Signature · Q-table · Phoenix traces · Redis
- MCP hub — one server in front of all the rest
- autonomy queue: research · drive · watch · repair · ship · reflect
- SOC2 evidence · mindful social gate (drafts you approve)
### apps
- web (nginx · /terminal owner workspace) · engine
- mcp-hub · site · ops · mobile · tester
## ③ Codegen — shared engine `serves Jarvis + Institute alike`
- Router · GraphRM (retrieval = the graph) · structured reasoning
- self-ingest (own code → graph) · self-rewrite (gated by measured eval Δ)
- eval harness · gap-to-Fable scorecard · osiiso lanes · 30 skills · tester peer
- siblings: selfwire (self-wiring agent) · Keel workstation (neurite engine)
## ④ Featured — the money
### Broadcaster — YouTube Channel Operator
- tiered, programmatic, done-for-you channel ops
#### stack
- Curator — sources, selects &amp; curates what runs
- Authentic — authenticity / brand-safety / compliance
- Operator — runs N channels per tenant (kestrels) · SLA + billing
#### pipeline
- scout → research → script → voice → visuals
- assemble → safety → review → publish → outreach → analytics → reward
#### tiers
- citizen/creator → private/corporate → cities/universities → gov/military → farming
#### media-gen ~3% ⟵ highest-ROI lever
### Advertising — Programmatic Digital Display
- your ad business: programmatic buying + digital display network
- modules to spec: inventory · bidding · creative · placement · measurement
## ⑤ Science — Environmental Science Platform `Saltline`
### TenderGraph — bid-seeking agent-graph
- tenders · gov/military · capex ≥ $50M · Edmonton + cities
### platform
- Saltline engine · Lead Graph · Observatory
- Resilience · Impact Assessment · Field Tools · Market · Agency
## ⑥ Graph Intelligence — research graph as product
### Map Graph — Thought Graph Network Builder
- graph-network builder · Studio · Suite · marketing site
### graph-engine (the expert viz)
- forms: Shell · Breach · Embedding · Force · Hypergraph
- Simplicial · Multiplex · Tesseract · Temporal · Hyperbolic · Connectome · Query · Coda
- fog · soft sprites · Möbius/Poincaré ball · cinematic camera · depth-of-field
### SDK (open-core)
- share Hebbian + Q-table over FAISS/Chroma
- keep the real 4D graph as hosted alpha
## ⑦ Quality — Tester
- one agent = one graph; tests repo + live stack
- pytest every app · pages @ 390 &amp; 1440px · propose | auto
- Testroom · Tester Console · Neurite Tester
## ⑧ Infra / spine
- Router — free / paid / local cascade · DMR `dmr/<model>` · /route-health
- osiiso lanes — ASYNC / THREAD / PROCESS
- MCP-of-MCP · warden gate · git-valve (two-way GitHub bus)
## ⑨ Fleet — home hardware `192.168.1.0/24`
### Thor (Jetson) `.203`
- inference / research · Phoenix :6006 · DRAW :9999 · agent 002
### R720 (production) `.204`
- prod server · fleet router :8776 · :8740 · agent 000 manager · 004 self
### Radha `.134`
- Windows node · agent 003
### Forgiveness `.252`
- MT5 trading bridge · agent 001
### DESKTOP-N3OCUP4 `.70`
- Windows node · agent 005
### network
- OpenWrt `.254` gateway · Krishna AP (Ubiquiti) `.250` · Boost2 extender
</script>
<script>
(function(){let mm=null;
  function boot(){const md=document.getElementById("src").textContent,svg=document.querySelector("svg.markmap");
    if(!(window.markmap&&window.markmap.Transformer&&window.markmap.Markmap)){return setTimeout(boot,80);}
    try{const r=new window.markmap.Transformer().transform(md);
      mm=window.markmap.Markmap.create(svg,{initialExpandLevel:2,maxWidth:320,nodeMinHeight:22,spacingVertical:9,spacingHorizontal:88,paddingX:14,duration:300,fitRatio:0.92,colorFreezeLevel:3},r.root);
      setTimeout(()=>mm.fit(),60);
      document.getElementById("ex").onclick=()=>mm.setData(r.root,{initialExpandLevel:-1}).then(()=>mm.fit());
      document.getElementById("co").onclick=()=>mm.setData(r.root,{initialExpandLevel:1}).then(()=>mm.fit());
      document.getElementById("fit").onclick=()=>mm.fit();
    }catch(e){setTimeout(boot,120);}}
  boot();
})();
</script>
</body>
</html>
