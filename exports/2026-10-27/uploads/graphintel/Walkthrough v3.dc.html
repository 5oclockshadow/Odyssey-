<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/nocturne-9ff5fde8-ef85-443e-9227-cefce455bb20/styles.css">
  <script src="_ds/nocturne-9ff5fde8-ef85-443e-9227-cefce455bb20/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); text-wrap: pretty; }
    a { color: var(--color-accent-300); } a:hover { color: var(--color-accent-200); }
    code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; color: var(--color-accent-200); }
    ::-webkit-scrollbar { height: 9px; width: 9px; } ::-webkit-scrollbar-thumb { background: var(--color-neutral-700); border-radius: 5px; }
  </style>
</helmet>
<div data-screen-label="Walkthrough v3" style="min-height:100vh;background:radial-gradient(ellipse 60% 40% at 15% 0%, var(--color-accent-900) 0%, transparent 55%), var(--color-bg);">
  <nav class="nav" style="position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px clamp(16px,4vw,44px);background:color-mix(in oklab, var(--color-bg) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-neutral-800);">
    <span class="nav-brand" style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;">Anima · Walkthrough v3</span>
    <div style="display:flex;flex-wrap:wrap;gap:4px;">
      <sc-for list="{{ maps }}" as="m" hint-placeholder-count="9"><button class="btn {{ m.cls }}" style="font-size:12px;white-space:nowrap;" onClick="{{ m.go }}">{{ m.label }}</button></sc-for>
    </div>
    <div style="margin-left:auto;display:flex;gap:4px;">
      <button class="btn btn-ghost" style="font-size:12px;" onClick="{{ expandAll }}">Expand all</button>
      <button class="btn btn-ghost" style="font-size:12px;" onClick="{{ collapseAll }}">Collapse</button>
    </div>
  </nav>

  <div style="max-width:1200px;padding:32px clamp(16px,4vw,44px) 90px;display:grid;gap:22px;">
    <header style="display:grid;gap:10px;max-width:880px;">
      <span style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-300);">{{ cur.kicker }}</span>
      <h1 style="margin:0;font-size:clamp(28px,4vw,42px);line-height:1.07;letter-spacing:-0.02em;font-weight:500;">{{ cur.title }}</h1>
      <p style="margin:0;font-size:17px;line-height:1.5;color:var(--color-neutral-300);">{{ cur.lede }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--color-neutral-400);"><span>{{ stat.nodes }} nodes</span><span>{{ stat.leaves }} features</span><sc-if value="{{ cur.hasOpen }}" hint-placeholder-val="{{ false }}"><a href="{{ cur.open }}" target="_blank">Open the thing itself ↗</a></sc-if></div>
    </header>

    <sc-if value="{{ viewing }}" hint-placeholder-val="{{ false }}">
      <div style="display:grid;gap:8px;">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;"><b style="font-size:15px;">{{ viewName }}</b><code style="font-size:11px;color:var(--color-neutral-400);">{{ viewSrc }}</code><button class="btn btn-ghost" style="font-size:12px;margin-left:auto;" onClick="{{ closeDoc }}">Close ✕</button></div>
        <div style="border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-neutral-700);background:var(--color-neutral-900);height:min(78vh,860px);">
          <iframe src="{{ viewSrc }}" title="{{ viewName }}" style="width:100%;height:100%;border:0;display:block;background:#fff;"></iframe>
        </div>
      </div>
    </sc-if>
    <div style="overflow-x:auto;padding:4px;">
      <div style="min-width:min(100%,680px);display:grid;gap:3px;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
          <div style="{{ r.rowSt }}">
            <button onClick="{{ r.toggle }}" style="{{ r.btnSt }}">{{ r.glyph }}</button>
            <div style="{{ r.cardSt }}">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
                <sc-if value="{{ r.hasHref }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.openDoc }}" style="padding:0;background:none;border:0;cursor:pointer;text-align:left;font-family:inherit;font-weight:{{ r.weight }};font-size:{{ r.size }}px;color:{{ r.linkInk }};text-decoration:underline;text-decoration-color:var(--color-accent-700);text-underline-offset:3px;">{{ r.label }} ↗</button></sc-if>
                <sc-if value="{{ r.noHref }}" hint-placeholder-val="{{ true }}"><span onClick="{{ r.toggle }}" style="font-weight:{{ r.weight }};font-size:{{ r.size }}px;color:{{ r.ink }};cursor:{{ r.cur }};">{{ r.label }}</span></sc-if>
                <sc-if value="{{ r.hasTag }}" hint-placeholder-val="{{ false }}"><span class="tag {{ r.tagCls }}" style="font-size:10px;">{{ r.tag }}</span></sc-if>
                <sc-if value="{{ r.collapsed }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:var(--color-neutral-500);">+{{ r.kids }}</span></sc-if>
              </div>
              <sc-if value="{{ r.hasNote }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;line-height:1.5;color:var(--color-neutral-400);">{{ r.note }}</span></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
