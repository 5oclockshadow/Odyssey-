# The Threshold Institute. `cp .env.example .env && docker compose up -d` is the whole install.
#
# Top layer: web (nginx), agent (the engine), one docker-in-docker for each of them, ops (the console) and tester (TESTER: one agent that is one graph).
#   web ── / the site · /terminal the owner workspace · /api/ → agent · /a/<port>/ → web-dind
#   └── web-dind    every app the agent ships, app-<name> on 8100–8199
#   agent ── the engine: one Signature, one graph, the loops. Its code is read-only to it.
#   └── agent-dind  sandbox runs in 8 languages · Phoenix :6006 · Redis :6379 · the MCP hub :8765 · terminal containers
# The engine starts Phoenix, Redis and the hub inside agent-dind itself at boot. Nothing else is on the top layer.
#
# Mounts: state (rw) is the only place the agent writes; registry (rw for agent, ro for web) is the apps list the site reads.
# The agent's root filesystem is read-only; its source is baked into the image, owned by root.

x-log: &log
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
x-hardening: &hardening
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  init:                                         # one-shot: the named volumes are created root-owned; the agent runs as uid 1000
    image: busybox:1.36
    command: sh -c "chown -R 1000:1000 /state /tester-state && mkdir -p /registry && chown 1000:1000 /registry && chmod 755 /registry"
    volumes: [state:/state, registry:/registry, tester-state:/tester-state]
    restart: "no"

  agent:
    <<: [*log, *hardening]
    build: .
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    env_file: .env
    environment:
      THRESHOLD_STATE: /state
      HOME: /tmp
      THRESHOLD_ROOT: /app
      APPS_REGISTRY: /registry/apps.json
      AGENT_DOCKER_HOST: tcp://agent-dind:2375
      WEB_DOCKER_HOST: tcp://web-dind:2375
      PHOENIX_ENDPOINT: http://agent-dind:6006
      PHOENIX_PUBLIC: http://localhost:6006
      HUB_URL: http://agent-dind:8765/mcp
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@agent-dind:6379/0
    volumes: [state:/state, registry:/registry]
    networks: [institute, agent-inner, web-inner]
    depends_on:
      init: { condition: service_completed_successfully }
      agent-dind: { condition: service_healthy }
      web-dind: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 40s
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped

  ops:                                          # the owner's console: every container on three daemons, logs, a shell in any of them, the repository
    <<: *log
    build: apps/ops
    env_file: .env
    environment:
      WORKSPACE: /workspace
      OPS_MODEL: ${OPS_MODEL:-anthropic/claude-haiku-4-5}
      ENGINE_URL: http://agent:8000
      PHOENIX_PUBLIC: http://localhost:6006
      AGENT_DOCKER_HOST: tcp://agent-dind:2375
      WEB_DOCKER_HOST: tcp://web-dind:2375
    volumes:
      - ./:/workspace                           # the repository, read-write: this is where you edit code (rebuild to deploy)
      - /var/run/docker.sock:/var/run/docker.sock   # the host daemon: full control of the stack. Anyone logged in as owner has it.
    networks: [institute, agent-inner, web-inner]
    depends_on: [agent]
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    restart: unless-stopped

  tester:                                       # TESTER: loads every app, site and page and the running stack, tests all of it, fixes what fails.
    <<: [*log, *hardening]                      # Its agent, brain, self, data, code and tools are one graph: /state/graph.json, served at :8090/graph
    build: { context: ., dockerfile: apps/tester/Dockerfile }
    user: "1000:1000"
    env_file: .env
    environment:
      TESTER_REPO: /repo
      TESTER_STATE: /state
      TESTER_WORK: /state/work
      TESTER_MODEL: ${TESTER_MODEL:-anthropic/claude-sonnet-4-5}
      TESTER_APPLY: ${TESTER_APPLY:-propose}     # propose: verified fixes wait for POST /fixes/{id}/apply · auto: written to the repository
      HOME: /tmp
    volumes:
      - ./:/repo                                # the repository: read to test; written only when a verified fix is applied
      - tester-state:/state                     # the graph, runs, patches and TESTER's working copy
    ports: ["127.0.0.1:8090:8090"]              # this host only, like Phoenix
    shm_size: 1gb                               # Chromium
    networks: [institute]                       # reaches web, agent and ops for the live checks
    depends_on:
      init: { condition: service_completed_successfully }
    mem_limit: 4g
    cpus: 2
    pids_limit: 1024
    restart: unless-stopped

  web:
    <<: [*log, *hardening]
    build: apps/web
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]   # nginx's master drops to its worker user
    ports: ["80:80"]
    volumes: [registry:/registry:ro]
    networks: [institute, web-inner]
    depends_on: [agent, ops]
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  agent-dind:
    <<: *log
    image: docker:27-dind
    privileged: true
    environment: { DOCKER_TLS_CERTDIR: "" }
    volumes: [agent-dind-storage:/var/lib/docker]
    ports: ["127.0.0.1:6006:6006"]              # Phoenix UI: this host only; reach it through an SSH tunnel
    networks: [agent-inner]
    healthcheck: { test: ["CMD", "docker", "info"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s }
    mem_limit: 8g
    cpus: 4
    restart: unless-stopped

  web-dind:
    <<: *log
    image: docker:27-dind
    privileged: true
    environment: { DOCKER_TLS_CERTDIR: "" }
    volumes: [web-dind-storage:/var/lib/docker]
    networks: [web-inner]
    healthcheck: { test: ["CMD", "docker", "info"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s }
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped

networks:
  institute: {}                                 # web ↔ agent
  agent-inner: { internal: false }              # agent ↔ agent-dind (its services need to reach the internet for packages and the market)
  web-inner: {}                                 # agent ↔ web-dind (ship), web ↔ web-dind (apps)

volumes:
  state: {}
  registry: {}
  tester-state: {}
  agent-dind-storage: {}
  web-dind-storage: {}
