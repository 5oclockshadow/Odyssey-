<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../_ds/nocturne-9ff5fde8-ef85-443e-9227-cefce455bb20/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <script src="../../_ds/nocturne-9ff5fde8-ef85-443e-9227-cefce455bb20/_ds_bundle.js"></script>
  <script src="./console-kit.js"></script>
  <style>
    html, body { margin: 0; background: #12131d; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-thumb { background: #2b2e42; border-radius: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    @keyframes tkspin { to { transform: rotate(360deg); } }
  </style>
</helmet>
<div data-screen-label="Console Studio" style="min-height:100vh;display:flex;flex-direction:column;background:#12131d;color:var(--color-text);font-family:var(--font-body);font-size:13px;">
  <header style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 18px;background:linear-gradient(180deg,#171828,#12131d);box-shadow:0 1px 0 var(--color-neutral-800);position:sticky;top:0;z-index:5;">
    <span style="display:inline-flex;align-items:center;gap:9px;"><i class="ph ph-terminal-window" style="font-size:20px;color:var(--color-accent-300);"></i><span style="font:600 12.5px ui-monospace,Menlo,monospace;letter-spacing:0.12em;">CONSOLE STUDIO</span></span>
    <span style="font:12.5px ui-monospace,Menlo,monospace;color:var(--color-accent-200);font-variant-numeric:tabular-nums;">{{ count }} / 200</span>
    <span style="display:inline-flex;gap:4px;padding:3px;border:1px solid var(--color-neutral-800);border-radius:9px;">
      <button type="button" class="{{ graphCls }}" style="min-height:28px;font-size:12px;padding:4px 11px;" onClick="{{ setGraph }}">Graph-console</button>
      <button type="button" class="{{ modernCls }}" style="min-height:28px;font-size:12px;padding:4px 11px;" onClick="{{ setModern }}">Modern</button>
    </span>
    <span style="font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);max-width:38ch;">{{ subtitle }}</span>
    <span style="margin-left:auto;display:flex;gap:6px;">
      <button type="button" class="btn btn-secondary" style="min-height:32px;font-size:12.5px;" onClick="{{ mixSel }}" disabled="{{ mixOff }}"><i class="ph ph-intersect" style="margin-right:5px;"></i>Mix selected ({{ nPicks }})</button>
      <button type="button" class="btn btn-ghost" style="min-height:32px;font-size:12.5px;" onClick="{{ regen }}"><i class="ph ph-shuffle" style="margin-right:5px;"></i>Regenerate</button>
    </span>
  </header>

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:grid;place-items:center;padding:80px 20px;"><div style="display:grid;gap:14px;justify-items:center;"><i class="ph ph-circle-notch" style="font-size:30px;color:var(--color-accent-300);animation:tkspin 1s linear infinite;"></i><span style="font-size:13.5px;color:color-mix(in srgb,var(--color-text) 70%,transparent);">Building 200 consoles…</span></div></div>
  </sc-if>

  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;padding:16px 18px 60px;display:grid;gap:18px;align-content:start;">

      <sc-if value="{{ hasMixes }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;gap:9px;">
          <span style="font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-300);">Mixes</span>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;">
            <sc-for list="{{ mixes }}" as="m" hint-placeholder-count="0">
              <div style="position:relative;border:1px solid var(--color-accent-700);border-radius:var(--radius-md);overflow:hidden;background:#0d0e16;box-shadow:0 0 0 1px color-mix(in srgb,var(--color-accent) 30%,transparent);">
                <div style="position:relative;aspect-ratio:4/3;overflow:hidden;">
                  <iframe src="{{ m.src }}" title="{{ m.label }}" loading="lazy" scrolling="no" sandbox="allow-scripts" style="position:absolute;top:0;left:0;width:200%;height:200%;transform:scale(0.5);transform-origin:top left;border:0;pointer-events:none;"></iframe>
                  <button type="button" onClick="{{ m.pick }}" title="Open" style="position:absolute;inset:0;border:0;background:transparent;cursor:pointer;"></button>
                  <span style="position:absolute;top:8px;left:8px;font:600 10px ui-monospace,Menlo,monospace;padding:2px 8px;border-radius:999px;background:var(--color-accent);color:#12131d;">MIX</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;"><span style="font-size:12px;font-weight:500;">{{ m.label }}</span><span style="margin-left:auto;font:10px ui-monospace,Menlo,monospace;color:color-mix(in srgb,var(--color-text) 52%,transparent);">{{ m.meta }}</span></div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <div style="display:grid;gap:9px;">
        <span style="font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-300);">{{ count }} console archetypes</span>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;">
          <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="0">
            <div style="{{ t.wrapSt }}">
              <div style="position:relative;aspect-ratio:4/3;overflow:hidden;background:#0d0e16;">
                <iframe src="{{ t.src }}" title="{{ t.label }}" loading="lazy" scrolling="no" sandbox="allow-scripts" style="position:absolute;top:0;left:0;width:200%;height:200%;transform:scale(0.5);transform-origin:top left;border:0;pointer-events:none;"></iframe>
                <button type="button" onClick="{{ t.open }}" title="Open {{ t.label }}" style="position:absolute;inset:0;border:0;background:transparent;cursor:pointer;"></button>
                <span style="position:absolute;top:8px;left:8px;font:600 10.5px ui-monospace,Menlo,monospace;padding:2px 7px;border-radius:999px;background:rgba(13,14,22,0.82);color:var(--color-accent-200);backdrop-filter:blur(4px);">{{ t.n }}</span>
                <button type="button" onClick="{{ t.toggle }}" title="Select for mixing" style="{{ t.pickSt }}"><i class="ph {{ t.pickIcon }}"></i></button>
              </div>
              <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;box-shadow:0 1px 0 var(--color-neutral-800) inset;">
                <span style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ t.label }}</span>
                <span style="margin-left:auto;font:10px ui-monospace,Menlo,monospace;color:color-mix(in srgb,var(--color-text) 52%,transparent);white-space:nowrap;">{{ t.meta }}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:rgba(9,10,16,0.86);backdrop-filter:blur(6px);">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px;background:#141522;box-shadow:0 1px 0 var(--color-neutral-800);">
        <span style="font:600 13px ui-monospace,Menlo,monospace;color:var(--color-accent-200);">{{ selTitle }}</span>
        <span style="font:11.5px ui-monospace,Menlo,monospace;color:color-mix(in srgb,var(--color-text) 58%,transparent);">{{ selMeta }}</span>
        <sc-if value="{{ selNav }}" hint-placeholder-val="{{ false }}">
          <span style="margin-left:14px;display:flex;align-items:center;gap:4px;">
            <button type="button" class="btn btn-ghost" title="Previous (←)" style="min-height:30px;padding:4px 9px;" onClick="{{ prevSel }}"><i class="ph ph-caret-left"></i></button>
            <span style="font:12px ui-monospace,Menlo,monospace;color:var(--color-accent-200);font-variant-numeric:tabular-nums;min-width:58px;text-align:center;">{{ selPos }}</span>
            <button type="button" class="btn btn-ghost" title="Next (→)" style="min-height:30px;padding:4px 9px;" onClick="{{ nextSel }}"><i class="ph ph-caret-right"></i></button>
          </span>
        </sc-if>
        <span style="margin-left:auto;display:flex;gap:6px;">
          <button type="button" class="btn btn-ghost" style="min-height:30px;font-size:12px;" onClick="{{ openTab }}"><i class="ph ph-arrow-square-out" style="margin-right:5px;"></i>Open in tab</button>
          <button type="button" class="btn btn-secondary" style="min-height:30px;font-size:12px;" onClick="{{ download }}"><i class="ph ph-download-simple" style="margin-right:5px;"></i>Download</button>
          <button type="button" class="btn btn-primary" style="min-height:30px;font-size:12px;" onClick="{{ close }}"><i class="ph ph-x" style="margin-right:5px;"></i>Close</button>
        </span>
      </div>
      <iframe src="{{ selUrl }}" title="{{ selTitle }}" sandbox="allow-scripts allow-popups" style="flex:1;width:100%;border:0;background:#0d0e16;"></iframe>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { specs: [], tiles: [], mixes: [], picks: [], sel: null, seed: 0, ready: false, err: '', batch: 'graph', cache: {} };

  componentDidMount() {
    this.gen(true);
    this._key = e => { if (!this.state.sel) return; if (e.key === 'ArrowRight') this.navSel(1); else if (e.key === 'ArrowLeft') this.navSel(-1); else if (e.key === 'Escape') this.setState({ sel: null }); };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { clearTimeout(this._t); window.removeEventListener('keydown', this._key); }

  gen(first) {
    const K = window.ConsoleKit;
    if (!K) { this._n = (this._n || 0) + 1; if (this._n > 40) { this.setState({ err: 'console-kit.js not found' }); return; } this._t = setTimeout(() => this.gen(first), 150); return; }
    const batch = this.state.batch, modern = batch === 'modern', ck = batch + ':' + this.state.seed;
    const built = this.state.cache[ck] || (() => { const specs = K.plan(200, this.state.seed, modern); return { specs, tiles: specs.map((sp, i) => ({ i, src: this.url(K.build(sp)), label: K.label(sp), meta: K.meta(sp) })) }; })();
    const next = { specs: built.specs, tiles: built.tiles, ready: true, err: '', cache: Object.assign({}, this.state.cache, { [ck]: built }) };
    if (first) { const req = [4, 45, 28, 24].map(n => n - 1); next.mixes = [this.makeMix(built.specs, req)]; }
    this.setState(next);
  }

  url(html) { return 'data:text/html;charset=utf-8,' + encodeURIComponent(html); }

  // Blend selected consoles: draw each structural trait from a different source, round-robin.
  mixSpec(sources) {
    const fields = ['frame', 'primary', 'aux', 'aux2', 'pal', 'density', 'mono'];
    const out = { seed: 2000 + sources.reduce((a, s) => a + (s.seed || 0), 0) };
    fields.forEach((f, k) => { const src = sources[k % sources.length]; out[f] = src[f]; });
    return out;
  }
  makeMix(specs, idxs) {
    const K = window.ConsoleKit, src = idxs.map(i => specs[i]).filter(Boolean);
    const sp = this.mixSpec(src);
    return { spec: sp, src: this.url(K.build(sp)), label: 'Mix · ' + idxs.map(i => String(i + 1).padStart(2, '0')).join('+'), meta: K.label(sp) + ' · ' + K.meta(sp) };
  }

  toggle(i) { this.setState(s => ({ picks: s.picks.includes(i) ? s.picks.filter(x => x !== i) : s.picks.concat(i) })); }
  mixSel() { const p = this.state.picks; if (p.length < 2) return; const m = this.makeMix(this.state.specs, p.slice().sort((a, b) => a - b)); this.setState(s => ({ mixes: [m].concat(s.mixes), picks: [] })); }

  regen() { this.setState(s => ({ seed: s.seed + 50, ready: false, tiles: [], picks: [], sel: null }), () => { this._n = 0; this.gen(false); }); }
  setBatch(b) { if (b === this.state.batch) return; this.setState({ batch: b, ready: false, tiles: [], picks: [], sel: null }, () => { this._n = 0; this.gen(false); }); }
  navSel(delta) { const s = this.state; if (!s.sel || s.sel.mix) return; const n = s.specs.length; this.openSpec((s.sel.i + delta + n) % n); }

  openSpec(i) { const sp = this.state.specs[i]; if (!sp) return; const K = window.ConsoleKit; this.setState({ sel: { i, spec: sp, url: this.url(K.build(sp)), title: '#' + String(i + 1).padStart(2, '0') + ' · ' + K.label(sp), meta: K.meta(sp) } }); }
  openMix(m) { this.setState({ sel: { i: -1, mix: true, spec: m.spec, url: m.src, title: m.label, meta: m.meta } }); }
  download() { const s = this.state.sel; if (!s) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([window.ConsoleKit.build(s.spec)], { type: 'text/html' })); a.download = (s.title || 'console').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.html'; document.body.appendChild(a); a.click(); a.remove(); }
  openTab() { const s = this.state.sel; if (!s) return; const w = window.open('', '_blank'); if (w) { w.document.open(); w.document.write(window.ConsoleKit.build(s.spec)); w.document.close(); } }

  renderVals() {
    const s = this.state, picked = new Set(s.picks);
    const isModern = s.batch === 'modern';
    return {
      ready: s.ready, loading: !s.ready && !s.err, count: String(s.tiles.length), nPicks: String(s.picks.length), mixOff: s.picks.length < 2,
      isGraph: !isModern, isModern, setGraph: () => this.setBatch('graph'), setModern: () => this.setBatch('modern'),
      graphCls: !isModern ? 'btn btn-primary' : 'btn btn-ghost', modernCls: isModern ? 'btn btn-primary' : 'btn btn-ghost',
      subtitle: isModern ? 'Modern · non-Nocturne. 200 unique in form, palette and style.' : 'Graph-console archetypes. 200 unique in form and layout.',
      hasMixes: s.mixes.length > 0,
      mixes: s.mixes.map(m => ({ src: m.src, label: m.label, meta: m.meta, pick: () => this.openMix(m) })),
      tiles: s.tiles.map(t => { const on = picked.has(t.i); return {
        n: String(t.i + 1).padStart(2, '0'), src: t.src, label: t.label, meta: t.meta,
        open: () => this.openSpec(t.i),
        toggle: () => this.toggle(t.i), pickIcon: on ? 'ph-check-circle' : 'ph-plus-circle',
        wrapSt: 'position:relative;border:1px solid ' + (on ? 'var(--color-accent)' : 'var(--color-neutral-800)') + ';border-radius:var(--radius-md);overflow:hidden;background:#0d0e16;box-shadow:' + (on ? '0 0 0 1px color-mix(in srgb,var(--color-accent) 35%,transparent)' : 'var(--shadow-sm)') + ';',
        pickSt: 'position:absolute;top:6px;right:6px;width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer;font-size:17px;background:rgba(13,14,22,0.82);backdrop-filter:blur(4px);color:' + (on ? 'var(--color-accent-200)' : 'color-mix(in srgb,var(--color-text) 70%,transparent)') + ';'
      }; }),
      hasSel: !!s.sel, selUrl: s.sel ? s.sel.url : '', selTitle: s.sel ? s.sel.title : '', selMeta: s.sel ? s.sel.meta : '',
      selNav: !!s.sel && !s.sel.mix, selPos: s.sel && !s.sel.mix ? (s.sel.i + 1) + ' / ' + s.specs.length : '',
      prevSel: () => this.navSel(-1), nextSel: () => this.navSel(1),
      close: () => this.setState({ sel: null }), download: () => this.download(), openTab: () => this.openTab(), mixSel: () => this.mixSel(), regen: () => this.regen()
    };
  }
}
</script>
</body>
</html>
