# The site. One origin for the pages, the engine (/api/) and every app the agent ships (/a/<port>/).
resolver 127.0.0.11 valid=10s ipv6=off;        # docker's DNS, so web-dind and agent resolve at request time, not at boot

server {
  listen 80;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  client_max_body_size 64k;                 # public doors take text, not uploads
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;

  location = /terminal { try_files /terminal.html =404; }   # the owner's terminal; it logs in through /api/auth/login
  location = /stack    { try_files /stack.html =404; }
  location = /research { try_files /research.html =404; }    # the public research place: live, published things in full, the rest greyed
  location = /space {                                        # the agent space, served by the ops container; it signs in through /api/auth/login
    set $ops http://ops:8080;
    proxy_pass $ops/ui/space.html;
  }
  location /reports/ { try_files $uri =404; }

  location /ops/ {                                           # the console's service: containers, files, shells (websocket), the ops agent
    set $ops http://ops:8080;
    rewrite ^/ops/(.*)$ /$1 break;
    proxy_pass $ops;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location /api/ {                                           # the agent's door, same origin as the site, so the owner cookie just works
    set $agent http://agent:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $agent;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location = /apps/apps.json {                               # the registry the agent writes when it ships an app
    alias /registry/apps.json;
    add_header Cache-Control no-store;
  }

  location ~ ^/a/(81[0-9]{2})$ { return 301 $uri/; }
  location ~ ^/a/(?<port>81[0-9]{2})/(?<rest>.*)$ {          # every shipped app runs inside web-dind on 8100–8199
    set $apps web-dind;
    proxy_pass http://$apps:$port/$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
