document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:#98a08a;font-size:12px;\">everything the agent holds, nothing greyed<\u002Fspan>\n    <span style=\"margin-left:auto;display:flex;gap:16px;font-size:12px;align-items:center;white-space:nowrap;\"><span style=\"{{ connStyle }}\">{{ conn }}<\u002Fspan><a href=\"{{ L.terminal }}\">Ops console<\u002Fa><a href=\"{{ L.site }}\">Public view<\u002Fa><\u002Fspan>\n  <\u002Fheader>\n  <div style=\"display:grid;grid-template-columns:210px minmax(0,1fr);min-height:0;\">\n    <nav style=\"border-right:1px solid #2b3024;background:#111310;padding:8px 0;display:grid;align-content:start;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"7\"><button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\"><span>{{ t.label }}<\u002Fspan><span style=\"{{ t.badgeStyle }}\">{{ t.badge }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n    <\u002Fnav>\n    <main style=\"min-height:0;overflow:auto;position:relative;\">\n      <div style=\"{{ vGraph }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid #20241b;\">\n          <span style=\"display:flex;gap:4px;\"><sc-for list=\"{{ hopBtns }}\" as=\"h\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ h.go }}\" style=\"{{ h.style }}\">{{ h.label }}<\u002Fbutton><\u002Fsc-for><\u002Fspan>\n          <button sc-camel-on-click=\"{{ home }}\" style=\"background:none;border:1px solid #2b3024;padding:3px 10px;cursor:pointer;color:#98a08a;white-space:nowrap;\">Reset focus<\u002Fbutton>\n          <span style=\"color:#98a08a;white-space:nowrap;\">{{ graphInfo }}<\u002Fspan>\n          <span style=\"margin-left:auto;display:flex;gap:8px;align-items:center;\"><span style=\"color:#98a08a;\">{{ focusLabel }}<\u002Fspan><button sc-camel-on-click=\"{{ publishFocus }}\" style=\"background:#c8f43a;color:#10140a;border:0;padding:3px 12px;font-weight:600;cursor:pointer;white-space:nowrap;\">Publish this node<\u002Fbutton><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;\"><div ref=\"{{ box }}\" style=\"position:absolute;inset:0;\"><\u002Fdiv><sc-if value=\"{{ offline }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;\"><span style=\"color:#98a08a;max-width:380px;text-align:center;line-height:1.6;\">Waiting for the engine and the owner login. The graph appears here, ungreyed, when the engine answers.<\u002Fspan><\u002Fdiv><\u002Fsc-if><div style=\"position:absolute;left:14px;right:14px;bottom:10px;font-size:11px;color:#98a08a;display:flex;flex-wrap:wrap;gap:4px 16px;\"><span style=\"white-space:nowrap;\"><span style=\"color:#c8f43a;\">●<\u002Fspan> approved for the public<\u002Fspan><span style=\"white-space:nowrap;\"><span style=\"color:#cfd5c2;\">●<\u002Fspan> private<\u002Fspan><span style=\"white-space:nowrap;\">fourth axis: distance from the centre = edge weight<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ vChat }}\">\n        <div style=\"overflow:auto;padding:16px 20px;display:grid;gap:14px;align-content:start;\"><sc-for list=\"{{ chat }}\" as=\"m\" hint-placeholder-count=\"1\"><div style=\"display:grid;gap:4px;max-width:820px;\"><span style=\"{{ m.whoStyle }}\">{{ m.who }}<\u002Fspan><span style=\"line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;\">{{ m.text }}<\u002Fspan><span style=\"font-size:11px;color:#646b58;font-family:'JetBrains Mono',monospace;\">{{ m.meta }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><sc-if value=\"{{ busy }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#98a08a;\">SEXTANT is working…<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <div style=\"padding:12px 20px;border-top:1px solid #20241b;display:flex;gap:10px;\"><textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ setDraft }}\" sc-camel-on-key-down=\"{{ draftKey }}\" rows=\"2\" placeholder=\"Talk to SEXTANT. It sees the whole graph and has its tools.\" style=\"flex:1;resize:none;background:#0b0c0a;border:1px solid #2b3024;padding:8px 10px;outline:none;\"><\u002Ftextarea><button sc-camel-on-click=\"{{ send }}\" style=\"background:#c8f43a;color:#10140a;border:0;padding:0 18px;font-weight:600;cursor:pointer;\">Send<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ vRecord }}\"><div style=\"padding:14px 20px;display:grid;gap:10px;max-width:980px;\"><sc-for list=\"{{ record }}\" as=\"r\" hint-placeholder-count=\"3\"><div style=\"padding:10px 12px;background:#181b15;border:1px solid #2b3024;display:grid;gap:6px;\"><div style=\"display:flex;gap:12px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#98a08a;\"><span style=\"color:#c8f43a;\">{{ r.kind }}<\u002Fspan><span>{{ r.when }}<\u002Fspan><span>{{ r.energy }}<\u002Fspan><\u002Fdiv><span style=\"color:#98a08a;overflow-wrap:anywhere;\">{{ r.intake }}<\u002Fspan><sc-if value=\"{{ r.hasTools }}\" hint-placeholder-val=\"{{ false }}\"><pre style=\"margin:0;font-size:11.5px;color:#98a08a;white-space:pre-wrap;overflow-wrap:anywhere;font-family:'JetBrains Mono',monospace;\">{{ r.tools }}<\u002Fpre><\u002Fsc-if><span style=\"line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;\">{{ r.answer }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><sc-if value=\"{{ noRecord }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#98a08a;\">No rounds yet.<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"{{ vPublish }}\"><div style=\"padding:14px 20px;display:grid;gap:10px;max-width:920px;\"><span style=\"color:#98a08a;line-height:1.5;\">The agent proposes what the public may see, with its sources. Approve to publish; retract to take it back down. Anything not in a published batch stays greyed on the site.<\u002Fspan><sc-for list=\"{{ batches }}\" as=\"b\" hint-placeholder-count=\"2\"><div style=\"padding:12px;background:#181b15;border:1px solid #2b3024;display:grid;gap:6px;\"><div style=\"display:flex;justify-content:space-between;gap:12px;\"><span style=\"font-weight:600;\">{{ b.title }}<\u002Fspan><span style=\"{{ b.statusStyle }}\">{{ b.status }}<\u002Fspan><\u002Fdiv><span style=\"font-size:12px;color:#98a08a;\">{{ b.counts }}<\u002Fspan><span style=\"white-space:pre-wrap;line-height:1.55;\">{{ b.note }}<\u002Fspan><span style=\"font-size:11px;color:#98a08a;overflow-wrap:anywhere;\">{{ b.sources }}<\u002Fspan><div style=\"display:flex;gap:8px;\"><sc-for list=\"{{ b.actions }}\" as=\"a\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ a.run }}\" style=\"{{ a.style }}\">{{ a.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-for><sc-if value=\"{{ noBatches }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#98a08a;\">No batches yet. Click a node in the graph and use Publish this node, or wait for the agent to propose one.<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"{{ vApprove }}\"><div style=\"padding:14px 20px;display:grid;gap:10px;max-width:920px;\"><span style=\"color:#98a08a;line-height:1.5;\">Upgrade proposals, incident repairs and post drafts waiting for you. Approving an upgrade or repair tests it in the sandbox and opens a pull request; the agent never edits its own code.<\u002Fspan><sc-for list=\"{{ approvals }}\" as=\"b\" hint-placeholder-count=\"2\"><div style=\"padding:12px;background:#181b15;border:1px solid #2b3024;display:grid;gap:6px;\"><div style=\"display:flex;justify-content:space-between;gap:12px;\"><span style=\"font-weight:600;overflow-wrap:anywhere;\">{{ b.title }}<\u002Fspan><span style=\"font-size:11px;color:#ffb02e;text-transform:uppercase;letter-spacing:0.08em;\">{{ b.kind }}<\u002Fspan><\u002Fdiv><span style=\"line-height:1.55;color:#cfd5c2;overflow-wrap:anywhere;\">{{ b.detail }}<\u002Fspan><div style=\"display:flex;gap:8px;\"><sc-for list=\"{{ b.actions }}\" as=\"a\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ a.run }}\" style=\"{{ a.style }}\">{{ a.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-for><sc-if value=\"{{ noApprovals }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#98a08a;\">Nothing waiting.<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"{{ vGate }}\"><div style=\"padding:14px 20px;display:grid;gap:6px;max-width:760px;\"><span style=\"color:#98a08a;line-height:1.5;\">The mindful gate every outbound post passes: caps, quiet hours, spacing, duplicates, banned claims, disclosure.<\u002Fspan><sc-for list=\"{{ gate }}\" as=\"g\" hint-placeholder-count=\"4\"><div style=\"display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;padding:5px 0;border-bottom:1px solid #20241b;\"><span style=\"color:#98a08a;\">{{ g.k }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;overflow-wrap:anywhere;\">{{ g.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <div style=\"{{ vHub }}\"><div style=\"padding:14px 20px;display:grid;gap:12px;max-width:980px;\"><div style=\"display:flex;gap:8px;\"><input value=\"{{ q }}\" sc-camel-on-change=\"{{ setQ }}\" sc-camel-on-key-down=\"{{ qKey }}\" placeholder=\"search the MCP market for a server\" style=\"flex:1;background:#0b0c0a;border:1px solid #2b3024;padding:6px 10px;outline:none;\"><button sc-camel-on-click=\"{{ search }}\" style=\"background:#c8f43a;color:#10140a;border:0;padding:0 16px;font-weight:600;cursor:pointer;\">Search<\u002Fbutton><\u002Fdiv>\n        <sc-for list=\"{{ market }}\" as=\"m\" hint-placeholder-count=\"0\"><div style=\"padding:8px 10px;background:#181b15;border:1px solid #2b3024;display:grid;gap:2px;\"><span style=\"font-weight:500;\">{{ m.name }} <span style=\"color:#98a08a;font-weight:400;\">{{ m.package }}<\u002Fspan><\u002Fspan><span style=\"font-size:12px;color:#98a08a;\">{{ m.description }}<\u002Fspan><span style=\"font-size:11px;color:#646b58;\">The agent installs servers itself with market_install; you see the result below.<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <span style=\"font-size:11px;letter-spacing:0.1em;color:#c8f43a;\">SERVERS<\u002Fspan>\n        <sc-for list=\"{{ servers }}\" as=\"s\" hint-placeholder-count=\"4\"><div style=\"display:grid;grid-template-columns:150px 70px minmax(0,1fr);gap:12px;padding:5px 0;border-bottom:1px solid #20241b;\"><span style=\"font-weight:500;\">{{ s.name }}<\u002Fspan><span style=\"color:{{ s.color }};\">{{ s.state }}<\u002Fspan><span style=\"color:#98a08a;overflow-wrap:anywhere;\">{{ s.note }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <span style=\"font-size:11px;letter-spacing:0.1em;color:#c8f43a;\">AUDIT<\u002Fspan>\n        <sc-for list=\"{{ audit }}\" as=\"a\" hint-placeholder-count=\"3\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#98a08a;overflow-wrap:anywhere;\">{{ a }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n  <footer style=\"display:flex;align-items:center;gap:18px;padding:0 12px;background:#c8f43a;color:#10140a;font-size:11.5px;font-weight:500;\"><span>{{ footer }}<\u002Fspan><span style=\"margin-left:auto;\">{{ flash }}<\u002Fspan><\u002Ffooter>\n  <sc-if value=\"{{ needsLogin }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:fixed;inset:0;background:rgba(11,12,10,0.9);display:grid;place-items:center;\"><div style=\"width:320px;padding:24px;background:#181b15;border:1px solid #2b3024;display:grid;gap:12px;\"><span style=\"font-size:11px;letter-spacing:0.1em;color:#c8f43a;\">OWNER<\u002Fspan><span style=\"font-size:18px;font-weight:600;\">Sign in to the agent space<\u002Fspan><input type=\"password\" value=\"{{ pw }}\" sc-camel-on-change=\"{{ setPw }}\" sc-camel-on-key-down=\"{{ pwKey }}\" placeholder=\"password\" style=\"background:#0b0c0a;border:1px solid #2b3024;padding:8px 10px;outline:none;\"><div style=\"display:flex;gap:12px;align-items:center;\"><button sc-camel-on-click=\"{{ login }}\" style=\"background:#c8f43a;color:#10140a;border:0;padding:6px 16px;font-weight:600;cursor:pointer;\">Sign in<\u002Fbutton><span style=\"color:#ff5b4a;font-size:12px;\">{{ loginError }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;apiUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;/api&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Services&quot;}}\">\nconst TABS = [['graph', 'Graph'], ['chat', 'Talk to SEXTANT'], ['record', 'The record'], ['publish', 'Publish queue'], ['approve', 'Upgrades and repairs'], ['gate', 'Drafts and gate'], ['hub', 'MCP hub']];\nconst SHOW = { graph: 'display:grid;grid-template-rows:auto minmax(0,1fr);height:100%;', chat: 'display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%;', record: 'display:block;', publish: 'display:block;', approve: 'display:block;', gate: 'display:block;', hub: 'display:block;' };\nconst btn = (primary, red) => `border:${primary ? 0 : '1px solid ' + (red ? '#ff5b4a' : '#2b3024')};background:${primary ? '#c8f43a' : 'transparent'};color:${primary ? '#10140a' : red ? '#ff5b4a' : '#e9ede0'};padding:3px 12px;cursor:pointer;white-space:nowrap;font-weight:${primary ? 600 : 400};`;\nconst hm = (ts) => { const d = new Date(typeof ts === 'number' ? ts * 1000 : ts); return isNaN(d) ? '' : d.toLocaleString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }); };\n\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.box = React.createRef(); this.state = { tab: 'graph', focus: 'institute', hops: 2, graph: null, chat: [], draft: '', busy: false, record: [], batches: [], day: null, mind: null, hub: null, market: [], q: '', pw: '', loginError: '', needsLogin: false, ok: false, flash: '' }; }\n  async call(path, opts = {}) {\n    const r = await fetch(String(this.props.apiUrl ?? '/api').replace(/\\/$/, '') + path, { credentials: 'include', ...opts, headers: { 'content-type': 'application/json' } });\n    if (r.status === 401) { this.setState({ needsLogin: true }); throw new Error('401'); }\n    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.detail || r.status); this.setState({ ok: true }); return j;\n  }\n  say(t) { this.setState({ flash: t }); clearTimeout(this.ft); this.ft = setTimeout(() => this.setState({ flash: '' }), 5000); }\n  componentDidMount() {\n    const h = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h)) this.setState({ tab: h });\n    this.wait = setInterval(() => { if (window.Graph3D) { clearInterval(this.wait); window.Graph3D.load().then(() => { if (!this.box.current) return; this.g = window.Graph3D.mount(this.box.current, { allLabels: true, onFocus: (id) => this.setState({ focus: id }, () => this.loadGraph()) }); this.loadGraph(); }); } }, 100);\n    this.refresh(); this.poll = setInterval(() => this.refresh(), 8000);\n  }\n  componentWillUnmount() { clearInterval(this.wait); clearInterval(this.poll); this.g && this.g.destroy(); }\n  async loadGraph() { try { const d = await this.call(`/owner/graph?focus=${encodeURIComponent(this.state.focus)}&hops=${this.state.hops}`); this.setState({ graph: d }); this.g && this.g.set({ ...d, nodes: d.nodes.map(n => ({ ...n, type: n.pub ? n.type : 'private' })) }); } catch (e) { if (e.message !== '401') this.setState({ ok: false }); } }\n  async refresh() {\n    const t = (p, k) => this.call(p).then(j => this.setState({ [k]: j })).catch(e => { if (e.message !== '401') this.setState({ ok: false }); });\n    await Promise.all([t('/owner/record?n=30', 'rec'), t('/owner/publish', 'pub'), t('/owner/day', 'day'), t('/owner/mindful', 'mind'), t('/owner/hub', 'hub')]);\n  }\n  async act(id, action) { try { const r = await this.call('/owner/act', { method: 'POST', body: JSON.stringify({ id, action }) }); this.say(r.ok === false ? `${action}: ${r.error || 'refused'}` : `${action}: done`); this.refresh(); this.loadGraph(); } catch (e) { this.say(`${action}: ${e.message}`); } }\n  async publishFocus() {\n    const n = this.state.graph && this.state.graph.nodes.find(x => x.id === this.state.focus); if (!n) return;\n    try { await this.call('/owner/publish', { method: 'POST', body: JSON.stringify({ title: n.label || n.id, node_ids: [n.id], note: '', now: true }) }); this.say(`published ${n.label}`); this.refresh(); this.loadGraph(); } catch (e) { this.say(e.message); }\n  }\n  async send() {\n    const text = this.state.draft.trim(); if (!text || this.state.busy) return;\n    this.setState(s => ({ draft: '', busy: true, chat: [...s.chat, { who: 'you', text }] }));\n    try { const r = await this.call('/owner/chat', { method: 'POST', body: JSON.stringify({ text, kind: 'chat' }) }); this.setState(s => ({ busy: false, chat: [...s.chat, { who: 'sextant', text: r.answer, meta: `+${r.nodes} nodes · +${r.hyperedges} edges${r.minted && r.minted.length ? ' · minted ' + r.minted.join(', ') : ''}` }] })); this.loadGraph(); }\n    catch (e) { this.setState(s => ({ busy: false, chat: [...s.chat, { who: 'sextant', text: `Could not reach the engine: ${e.message}` }] })); }\n  }\n  async search() { try { const r = await this.call('/owner/hub/market?q=' + encodeURIComponent(this.state.q)); this.setState({ market: r.results || [] }); } catch (e) { this.say(e.message); } }\n  async login() {\n    const r = await fetch(String(this.props.apiUrl ?? '/api').replace(/\\/$/, '') + '/auth/login', { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: this.state.pw }) });\n    if (r.ok) { this.setState({ pw: '', loginError: '', needsLogin: false }); this.refresh(); this.loadGraph(); } else { const j = await r.json().catch(() => ({})); this.setState({ loginError: j.detail || `failed (${r.status})` }); }\n  }\n  renderVals() { const p = location.pathname, m = /\\.dc\\.html$/.test(p) ? 0 : /\\/(dist|ui)\\//.test(p) ? 1 : 2, pick = (a) => a[m]; const L = { terminal: pick(['Console.dc.html', '../../web/dist/terminal.html', '/terminal']), site: pick(['../../web/src/Research.dc.html', '../../web/dist/research.html', '/research'])}; return { L, ...this.rv() }; }\n  rv() {\n    const s = this.state, show = (id) => s.tab === id ? SHOW[id] : 'display:none;', g = s.graph, node = g && g.nodes.find(n => n.id === s.focus);\n    const items = ((s.day && s.day.stream) || []).filter(x => ['upgrade', 'incident', 'post'].includes(x.kind) && x.status !== 'done');\n    const pending = (s.pub && s.pub.batches || []).filter(b => b.status === 'proposed').length, waiting = items.length;\n    const mind = s.mind || {}; const flat = (o, p = '') => Object.entries(o).flatMap(([k, v]) => v && typeof v === 'object' && !Array.isArray(v) ? flat(v, p + k + '.') : [{ k: p + k, v: Array.isArray(v) ? v.join(', ') : String(v) }]);\n    return {\n      box: this.box, conn: s.ok ? 'live' : s.needsLogin ? 'signed out' : 'engine not reachable', connStyle: `color:${s.ok ? '#3fd68f' : '#ff5b4a'};`,\n      tabs: TABS.map(([id, label]) => { const n = id === 'publish' ? pending : id === 'approve' ? waiting : 0; return { label, badge: n || '', go: () => this.setState({ tab: id }), style: `all:unset;box-sizing:border-box;display:flex;justify-content:space-between;padding:8px 14px;gap:8px;white-space:nowrap;cursor:pointer;color:${s.tab === id ? '#e9ede0' : '#98a08a'};border-left:2px solid ${s.tab === id ? '#c8f43a' : 'transparent'};background:${s.tab === id ? '#20241b' : 'transparent'};`, badgeStyle: 'color:#ffb02e;font-family:JetBrains Mono,monospace;' }; }),\n      vGraph: show('graph'), vChat: show('chat'), vRecord: show('record'), vPublish: show('publish'), vApprove: show('approve'), vGate: show('gate'), vHub: show('hub'),\n      hopBtns: [1, 2, 3].map(h => ({ label: `${h} hop${h > 1 ? 's' : ''}`, go: () => this.setState({ hops: h }, () => this.loadGraph()), style: btn(s.hops === h) })), home: () => this.setState({ focus: 'institute' }, () => this.loadGraph()),\n      graphInfo: g ? `${g.nodes.length} shown of ${g.total.nodes} nodes · ${g.total.published} published` : (s.ok ? 'loading…' : 'engine not connected'), offline: !g, focusLabel: node ? `${node.label || node.id}${node.pub ? ' (public)' : ' (private)'}` : '', publishFocus: () => this.publishFocus(),\n      chat: s.chat.map(m => ({ who: m.who === 'you' ? 'YOU' : 'SEXTANT', text: m.text, meta: m.meta || '', whoStyle: `font-size:10.5px;letter-spacing:0.1em;color:${m.who === 'you' ? '#98a08a' : '#c8f43a'};` })), busy: s.busy, draft: s.draft,\n      setDraft: (e) => this.setState({ draft: e.target.value }), draftKey: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } }, send: () => this.send(),\n      record: ((s.rec && s.rec.rounds) || []).map(r => ({ kind: r.kind, when: hm(r.ts), energy: r.energy ? `ΔE ${Number(r.energy.delta ?? r.energy).toFixed ? Number(r.energy.delta ?? r.energy).toFixed(2) : ''}` : '', intake: String(r.intake || '').slice(0, 280), answer: String(r.answer || '').slice(0, 900),\n        hasTools: !!(r.tools || r.trajectory), tools: JSON.stringify(r.tools || r.trajectory || '', null, 1).slice(0, 900) })), noRecord: !(s.rec && s.rec.rounds && s.rec.rounds.length),\n      batches: ((s.pub && s.pub.batches) || []).map(b => ({ title: b.title, status: b.status, counts: `${b.nodes.length} nodes · ${b.edges.length} edges · ${hm(b.ts)}`, note: b.note, sources: (b.sources || []).join(' · '), statusStyle: `font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:${b.status === 'published' ? '#3fd68f' : b.status === 'proposed' ? '#ffb02e' : '#98a08a'};`,\n        actions: (b.status === 'proposed' ? [['approve', 'Approve', 1], ['decline', 'Decline']] : b.status === 'published' ? [['retract', 'Retract', 0, 1]] : []).map(([a, l, p, r]) => ({ label: l, style: btn(p, r), run: () => this.act(b.id, a) })) })), noBatches: !(s.pub && s.pub.batches && s.pub.batches.length),\n      approvals: items.map(x => ({ title: x.title, kind: x.kind, detail: x.detail, actions: (x.actions || []).map((a, i) => ({ label: a.label, style: btn(i === 0, /
