[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfwire"
version = "0.3.0"
description = "Self-extending DSPy agent with a local Workbench: chat, live codebase CRUD, test-gated self-improvement, neon dashboard."
requires-python = ">=3.13"
dependencies = [
    "dspy>=3.4.0",
    "mcp[cli]>=1.27.0,<2",
    "pydantic>=2.13.0",
    "networkx>=3.6.0",
    "redis>=8.1.0",
    "osiiso>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
telemetry = ["arize-phoenix-otel>=0.7.0", "openinference-instrumentation-dspy>=0.1.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=1.0.0", "pytest-timeout>=2.3.0"]

[project.scripts]
selfwire-workbench = "selfwire.workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["selfwire*"]

[tool.setuptools.package-data]
"selfwire.workbench" = ["ui/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
