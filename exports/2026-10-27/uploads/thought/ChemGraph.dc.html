<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html, body { margin: 0; height: 100%; background: #161826; }</style></helmet>
<dc-import name="Suite App" app="chemgraph" agents="{{ agents }}" hebb-rule="{{ hebbRule }}" q-learn="{{ qLearn }}" q-epsilon="{{ qEpsilon }}" hint-size="100vw,100vh"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;agents&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:8,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Discovery&quot;},&quot;hebbRule&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;oja&quot;,&quot;bcm&quot;,&quot;hebb&quot;,&quot;off&quot;],&quot;default&quot;:&quot;oja&quot;,&quot;tsType&quot;:&quot;'oja'|'bcm'|'hebb'|'off'&quot;,&quot;section&quot;:&quot;Learning&quot;},&quot;qLearn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Learning&quot;},&quot;qEpsilon&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.01,&quot;default&quot;:0.15,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Learning&quot;}}"></script>
</body>
</html>
