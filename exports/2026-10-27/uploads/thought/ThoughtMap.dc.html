<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html, body { margin: 0; height: 100%; background: #161826; }</style></helmet>
<dc-import name="Suite App" app="thoughtmap" hebb-rule="{{ hebbRule }}" hebb-rate="{{ hebbRate }}" hebb-decay="{{ hebbDecay }}" q-learn="{{ qLearn }}" q-alpha="{{ qAlpha }}" q-gamma="{{ qGamma }}" q-epsilon="{{ qEpsilon }}" q-explore="{{ qExplore }}" q-horizon="{{ qHorizon }}" hint-size="100vw,100vh"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;hebbRule&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;oja&quot;,&quot;bcm&quot;,&quot;hebb&quot;,&quot;off&quot;],&quot;default&quot;:&quot;oja&quot;,&quot;tsType&quot;:&quot;'oja'|'bcm'|'hebb'|'off'&quot;,&quot;section&quot;:&quot;Hebbian plasticity&quot;},&quot;hebbRate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.005,&quot;max&quot;:0.3,&quot;step&quot;:0.005,&quot;default&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hebbian plasticity&quot;},&quot;hebbDecay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.02,&quot;step&quot;:0.001,&quot;default&quot;:0.002,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hebbian plasticity&quot;},&quot;qLearn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Q-table&quot;},&quot;qAlpha&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.05,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:0.3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Q-table&quot;},&quot;qGamma&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.99,&quot;step&quot;:0.01,&quot;default&quot;:0.8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Q-table&quot;},&quot;qEpsilon&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.01,&quot;default&quot;:0.15,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Q-table&quot;},&quot;qExplore&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;default&quot;:0.35,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Q-table&quot;},&quot;qHorizon&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:20,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Q-table&quot;}}"></script>
</body>
</html>
