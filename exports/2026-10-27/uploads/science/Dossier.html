<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saltline Dossier Suite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="suite-theme.css">
<script src="suite-theme.js"></script>
<script src="suite-launcher.js"></script>
<script src="suite-nav.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;line-height:1.55}
a{color:var(--color-accent-300)}a:hover{color:var(--color-accent-200)}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--color-neutral-800) 48px,var(--color-neutral-800) calc(100% - 48px),transparent)}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--color-bg) 86%,transparent);backdrop-filter:blur(12px)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:nowrap}
@media(max-width:760px){.top-in .btn-ghost{display:none}}
.brand{flex:none;white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--color-text);text-decoration:none}
.brand .mk{box-sizing:border-box;flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--color-accent);display:grid;place-items:center;box-shadow:0 0 18px color-mix(in srgb,var(--color-accent) 45%,transparent);color:var(--color-accent-300);font-size:15px}
.links{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none}.links::-webkit-scrollbar{display:none}.links a{white-space:nowrap}
@media(max-width:1060px){.links{mask-image:linear-gradient(90deg,#000 82%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent)}}
.links a{color:var(--color-neutral-400);text-decoration:none;padding:6px 10px;border-radius:var(--radius-md);font-size:13px}
.links a:hover{color:var(--color-text);background:var(--color-neutral-900)}
.links a.on{color:var(--color-text);background:var(--color-accent-900)}
.sp{flex:1}
.btn{white-space:nowrap}
.mk i.ph{font-size:15px;line-height:1;display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.view{padding-bottom:80px}
.kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-300)}
h1{font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1.06;letter-spacing:-.02em;margin:14px 0 16px;max-width:820px;text-wrap:balance}
h2{font-weight:600;font-size:24px;letter-spacing:-.01em;margin:0 0 6px}
h3{font-weight:600;font-size:16px;margin:0}
.lede{font-size:17px;color:var(--color-neutral-300);max-width:640px;margin:0 0 26px;text-wrap:pretty}
.hero{position:relative;padding:84px 0 64px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-30% -10% auto auto;width:760px;height:760px;background:radial-gradient(circle,color-mix(in srgb,var(--color-accent) 22%,transparent),transparent 62%);pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{padding-block:44px}
.sub{color:var(--color-neutral-400);margin:0 0 20px;max-width:640px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pcard{background:var(--color-surface);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pcard .ic{font-size:22px;color:var(--color-accent-300)}
.pcard p{margin:0;color:var(--color-neutral-400);font-size:13px}
.pcard .for{font-size:12px;color:var(--color-neutral-500)}
.pcard.sel{box-shadow:0 0 0 1px var(--color-accent),0 0 24px color-mix(in srgb,var(--color-accent) 25%,transparent)}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.step{padding:16px 0 0;border-top:1px solid var(--color-neutral-800)}
.step b{display:block;font-weight:600;margin-bottom:4px}.step span{color:var(--color-neutral-400);font-size:13px}
.step .n{font-family:var(--font-mono);font-size:12px;color:var(--color-accent-300);margin-bottom:8px;display:block}
.engine{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));background:var(--color-neutral-900);border-radius:var(--radius-lg);overflow:hidden}
.engine div{background:var(--color-bg);padding:18px}.engine b{font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:4px}.engine span{color:var(--color-neutral-400);font-size:13px}
.panel{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.phd{display:flex;align-items:center;gap:8px;padding:14px 16px 0;font-weight:600}
.phd .r{margin-left:auto;color:var(--color-neutral-500);font-size:12px;font-weight:400}
.pb{padding:14px 16px 16px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;color:var(--color-neutral-400)}.f label em{color:var(--color-accent-300);font-style:normal}
.f input,.f textarea,.f select{background:var(--color-bg);border:1px solid var(--color-neutral-800);border-radius:var(--radius-md);color:var(--color-text);font:14px var(--font-body);padding:9px 11px}
.f textarea{min-height:68px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--color-accent-600);outline:none}
.f.bad input,.f.bad textarea{border-color:var(--bad)}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.fg{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}.fg .wide{grid-column:1/-1}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
.drop{border:1px dashed var(--color-neutral-700);border-radius:var(--radius-lg);padding:26px;text-align:center;color:var(--color-neutral-400);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 6%,transparent)}
.drop i{font-size:28px;color:var(--color-accent-300);display:block;margin-bottom:6px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-md);background:var(--color-bg)}
.file i{color:var(--color-neutral-400)}.file .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file .sz{color:var(--color-neutral-500);font-size:12px}
.file .x{background:none;border:0;color:var(--color-neutral-500);cursor:pointer;padding:2px}.file .x:hover{color:var(--color-text)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.stat{background:var(--color-bg);border-radius:var(--radius-md);padding:10px}
.stat span{display:block;font-size:11px;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:.06em}.stat b{font:500 20px var(--font-mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tree{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.tnode{padding:8px 10px;border-left:2px solid var(--color-accent-700);background:var(--color-bg);border-radius:0 var(--radius-md) var(--radius-md) 0;font-size:13px;color:var(--color-neutral-300)}
.tnode b{font-weight:600;color:var(--color-accent-300);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block}
.progress{height:4px;background:var(--color-neutral-900);border-radius:3px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:var(--color-accent);box-shadow:0 0 10px var(--color-accent);transition:width .25s}
.note{color:var(--color-neutral-500);font-size:12px}
.err{color:var(--bad);font-size:13px}
.stepper{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.stepper div{display:flex;align-items:center;gap:8px;color:var(--color-neutral-500);font-size:13px}
.stepper div b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--color-neutral-700);font-weight:600;font-size:12px}
.stepper div.on{color:var(--color-text)}.stepper div.on b{border-color:var(--color-accent);color:var(--color-accent-300)}
.stepper div.done b{background:var(--color-accent-900);border-color:var(--color-accent-700)}
.stepper .ln{width:28px;height:1px;background:var(--color-neutral-800)}
.dlayout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
@media(max-width:980px){.dlayout{grid-template-columns:1fr}}
.doc{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:48px 56px;max-width:820px}
@media(max-width:600px){.doc{padding:26px 20px}}
.doc .cover .kick{margin-bottom:10px}
.doc h1{font-size:32px;margin:6px 0 4px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 20px;margin:22px 0 6px;font-size:13px}
.meta span{display:block;font-size:11px;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:.06em}
.dsec{padding-top:26px;margin-top:26px;position:relative}
.dsec:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--color-neutral-800) 48px,var(--color-neutral-800) calc(100% - 48px),transparent)}
.dsec .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dsec .no{font:500 13px var(--font-mono);color:var(--color-accent-300)}
.dsec h3{font-size:20px;letter-spacing:-.01em}
.dsec .chips{margin:8px 0 6px}
.dsec h4{font-weight:600;font-size:14px;margin:16px 0 4px;color:var(--color-neutral-200)}
.dsec p,.dsec li{color:var(--color-neutral-300);font-size:14.5px;line-height:1.65}
.dsec ul{padding-left:18px}
.cite{font:500 10px var(--font-mono);color:var(--color-accent-300);background:var(--color-accent-900);border-radius:4px;padding:0 4px;margin-left:2px;cursor:help}
.gap{font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:4px;padding:1px 6px}
details.src{margin-top:8px}details.src summary{cursor:pointer;color:var(--color-neutral-500);font-size:12px}
.srcl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.srcl div{font-size:12px;color:var(--color-neutral-400);background:var(--color-bg);padding:7px 9px;border-radius:var(--radius-md)}
.srcl b{font:500 11px var(--font-mono);color:var(--color-accent-300);margin-right:6px}
.trace{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.tr{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;color:var(--color-neutral-300)}
.tr span:last-child{font-family:var(--font-mono);color:var(--color-neutral-400)}
.spin{width:14px;height:14px;border:2px solid var(--color-accent-800);border-top-color:var(--color-accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.smap{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.sl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--color-neutral-900);font-size:13.5px}
.sl a{flex:1}.sl .st{font:500 11px var(--font-mono);color:var(--color-neutral-500)}.sl .st.ok{color:var(--ok)}.sl .st.bad{color:var(--bad)}
/* advisor */
.adv-btn{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-accent);box-shadow:var(--shadow-md),0 0 24px color-mix(in srgb,var(--color-accent) 30%,transparent);cursor:pointer;font:500 13px var(--font-body)}
.adv-btn:hover{background:var(--color-accent-900)}
.adv{position:fixed;right:22px;bottom:78px;z-index:41;width:min(390px,calc(100vw - 32px));height:min(560px,calc(100vh - 120px));background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
.adv.on{display:flex}
.adv-h{padding:14px 16px;display:flex;align-items:center;gap:10px}
.adv-h i{color:var(--color-accent-300);font-size:18px}.adv-h small{display:block;color:var(--color-neutral-500);font-size:11.5px}
.adv-m{flex:1;overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13.5px;line-height:1.55;padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--color-accent-900);color:var(--color-accent-100)}
.msg.a{align-self:flex-start;background:var(--color-bg);color:var(--color-neutral-200)}
.adv-q{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.adv-q button{background:none;border:1px solid var(--color-neutral-800);color:var(--color-neutral-300);border-radius:999px;padding:5px 10px;font:12px var(--font-body);cursor:pointer}
.adv-q button:hover{border-color:var(--color-accent);color:var(--color-text)}
.adv-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--color-neutral-900)}
.adv-f input{flex:1;background:var(--color-bg);border:1px solid var(--color-neutral-800);border-radius:var(--radius-md);color:var(--color-text);padding:9px 11px;font:13.5px var(--font-body)}
@media print{.top,.adv-btn,.adv,.trace,.noprint{display:none!important}body{background:#fff;color:#111}.doc{box-shadow:none;background:#fff;color:#111;padding:0;max-width:none}.dsec p,.dsec li{color:#222}.dlayout{display:block}}
</style>
</head>
<body>
<div data-suite-nav="dossiers"></div>
<div style="position:sticky;top:54px;z-index:30;background:color-mix(in srgb,var(--color-bg) 92%,transparent);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--color-neutral-900)"><div style="display:flex;align-items:center;gap:12px;max-width:1560px;margin:0 auto;padding:6px 22px;flex-wrap:wrap"><nav class="links" id="links"></nav><span style="flex:1"></span><a class="btn btn-primary" href="Onboarding.html">Start onboarding</a></div></div>
<main class="view" id="view"></main>
<button class="adv-btn" id="advBtn"><i class="ph ph-sparkle"></i>Ask the advisor</button>
<section class="adv" id="adv" aria-label="Advisor">
  <div class="adv-h"><i class="ph ph-sparkle"></i><div><b style="font-weight:600">Saltline Advisor</b><small>Steers you to the right product and next step</small></div><span class="sp"></span><button class="btn btn-ghost btn-icon" id="advX" aria-label="Close"><i class="ph ph-x"></i></button></div>
  <div class="adv-m" id="advM"></div>
  <div class="adv-q" id="advQ"></div>
  <form class="adv-f" id="advF"><input id="advI" autocomplete="off" placeholder="Ask about products, documents, gaps…"><button class="btn btn-primary btn-icon" aria-label="Send"><i class="ph ph-paper-plane-tilt"></i></button></form>
</section>

<script type="module">
import * as C from './suite-core.js';
const { esc } = C, $ = s => document.querySelector(s);
const S = C.db.get('client', null) || { ob: 1, client: {}, intake: {}, product: 'dossier', docs: [], dossier: null, chat: [] };
const save = () => { if (!C.db.set('client', S)) { const lite = { ...S, docs: S.docs.map(d => ({ ...d, text: d.text.slice(0, 20000) })) }; C.db.set('client', lite); } };
const cache = new C.RedisLite(), qt = new C.QTable(C.db.get('q', null));
let ING = null, building = null;
const prod = id => C.PRODUCTS.find(p => p.id === id) || C.PRODUCTS[0];

/* ---------- routing ---------- */
const VIEWS = { '#/': home, '#/products': products, '#/onboarding': onboarding, '#/intake': intake, '#/dossier': dossier, '#/sitemap': sitemap };
function route() {
  const h = VIEWS[location.hash] ? location.hash : '#/';
  $('#links').innerHTML = C.ROUTES.filter(r => r[0] !== '#/').map(([href, l]) => `<a href="${href}" class="${href === h ? 'on' : ''}">${l}</a>`).join('');
  $('#view').innerHTML = VIEWS[h](); window.scrollTo(0, 0);
  (BIND[h] || (() => {}))();
  quick();
}
window.addEventListener('hashchange', route);

/* ---------- views ---------- */
function home() {
  return `<section class="hero"><div class="wrap">
    <div class="kick">Saltline Suite · environmental dossiers</div>
    <h1>Walk into the regulator with the complete file.</h1>
    <p class="lede">Upload what you already have. The engine reads every document, builds a summary tree and a knowledge graph of your site, then drafts a cited pre-submission dossier and tells you exactly what is still missing.</p>
    <div class="row"><a class="btn btn-primary" href="Onboarding.html">Start onboarding<i class="ph ph-arrow-right"></i></a><a class="btn btn-ghost" href="#/products">See the suite</a></div>
  </div></section>
  <section class="wrap sec"><h2>The suite</h2><p class="sub">Five products, one engine. Each one ends in a document you can take to a regulator or a major environmental consultancy.</p>
    <div class="grid">${C.PRODUCTS.map(pc).join('')}</div></section>
  <section class="wrap sec"><h2>How it works</h2><p class="sub">Four steps, usually under an hour of your time.</p>
    <div class="steps">
      <div class="step"><span class="n">01</span><b>Onboard</b><span>Tell us who you are, the project and who you are meeting. The advisor recommends a product.</span></div>
      <div class="step"><span class="n">02</span><b>Intake &amp; upload</b><span>Fill the intake sheet or import one, and drop in PDFs, Word, Excel, CSV and notes.</span></div>
      <div class="step"><span class="n">03</span><b>Graph ingestion</b><span>Documents are chunked, summarised into a RAPTOR tree and linked into a knowledge graph.</span></div>
      <div class="step"><span class="n">04</span><b>Dossier</b><span>Every section is drafted from retrieved evidence with citations, plus a gap list to close.</span></div>
    </div></section>
  <section class="wrap sec"><h2>Under the hood</h2><p class="sub">The same engine runs the console's intelligence graph and the tester agent.</p>
    <div class="engine">
      <div><b><i class="ph ph-graph"></i>Graph retriever</b><span>A DSPy-style Retrieve module whose index is the knowledge graph: seed by relevance, expand 1–3 hops.</span></div>
      <div><b><i class="ph ph-tree-structure"></i>RAPTOR tree</b><span>Chunks are clustered and recursively summarised so queries can hit detail or the big picture.</span></div>
      <div><b><i class="ph ph-lightning"></i>Redis-style cache</b><span>Summaries and retrievals are cached with TTLs, so repeat questions answer instantly.</span></div>
      <div><b><i class="ph ph-brain"></i>Hebbian + Q-table</b><span>Co-retrieved evidence strengthens its links; a Q-table learns the best retrieval strategy per section.</span></div>
    </div></section>`;
}
const pc = p => `<div class="pcard${S.product === p.id ? ' sel' : ''}" data-prod="${p.id}"><i class="ic ph ${p.icon}"></i><h3>${esc(p.name)}</h3><p>${esc(p.short)}</p><div class="for">${esc(p.for)} · ${p.sections.length} sections</div></div>`;
function products() {
  return `<section class="wrap sec" style="padding-top:56px"><div class="kick">Products</div><h2 style="font-size:32px;margin-top:10px">The Saltline Suite</h2><p class="sub">Pick the document you need. You can switch later; your intake and documents carry over.</p>
  <div style="display:flex;flex-direction:column;gap:12px">${C.PRODUCTS.map(p => `<div class="panel"><div class="pb" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:20px;align-items:start">
    <div><i class="ph ${p.icon}" style="font-size:22px;color:var(--color-accent-300)"></i><h3 style="margin-top:8px">${esc(p.name)}</h3><p class="note" style="margin:4px 0 0">${esc(p.for)}</p></div>
    <div><p style="margin:0 0 8px;color:var(--color-neutral-300)">${esc(p.short)}</p><div class="chips">${p.sections.map(s => `<span class="tag tag-neutral">${esc(C.SECTIONS[s].t)}</span>`).join('')}</div></div>
    <button class="btn ${S.product === p.id ? 'btn-primary' : 'btn-secondary'}" data-choose="${p.id}">${S.product === p.id ? 'Selected' : 'Choose'}</button></div></div>`).join('')}</div></section>`;
}
function onboarding() {
  const st = S.ob, c = S.client;
  const dot = (n, l) => `<div class="${st === n ? 'on' : st > n ? 'done' : ''}"><b>${st > n ? '<i class="ph ph-check"></i>' : n}</b>${l}</div>`;
  let body = '';
  if (st === 1) body = `<div class="fg">${f('org', 'Organisation', c.org, 1)}${f('contact', 'Contact name & email', c.contact)}${f('role', 'Your role', c.role)}${f('sector', 'Sector', c.sector)}</div>`;
  if (st === 2) body = `<div class="fg">${f('project', 'Project name', c.project, 1)}${f('location', 'Site location', c.location, 1)}${f('authority', 'Who are you meeting?', c.authority, 0, 'e.g. the environment agency, or a consultancy')}${f('meeting', 'Meeting date', c.meeting, 0, '', 'date')}<div class="f wide"><label>Where is the project now?</label><div class="seg" id="stage">${['Concept', 'Pre-application', 'Submitted', 'Operating'].map(x => `<button type="button" class="seg-opt${c.stage === x ? ' on' : ''}" data-stage="${x}" aria-pressed="${c.stage === x}">${x}</button>`).join('')}</div></div></div>`;

async function runIngest(useLLM) {

  const list = C.db.get('dossiers', []); list.unshift({ project: S.intake.project, org: S.intake.org, product: prod(S.product).name, sections: secs.length, coverage: secs.filter(s => s.id !== 'gaps').reduce((a, s) => a + s.coverage, 0) / Math.max(1, secs.length - 1), t: Date.now() }); C.db.set('dossiers', list.slice(0, 50));

  if (!C.hasClaude()) { S.chat.push({ r: 'a', t: 'The advisor needs the assistant runtime, which is not available here.' }); renderChat(); return; }
  $('#advM').insertAdjacentHTML('beforeend', '<div class="msg a" id="typing"><span class="spin"></span></div>'); $('#advM').scrollTop = 1e6;
  const state = { page: location.hash || '#/', product: prod(S.product).name, client: S.client, intakeMissing: C.validateIntake(S.intake), docs: S.docs.map(d => d.name + ' (' + d.kind + ')'), ingestion: ING ? { chunks: ING.chunks, levels: ING.levels, entities: ING.entityList.slice(0, 15), errors: ING.errors } : 'not run', dossier: S.dossier ? S.dossier.sections.map(s => s.title + ': ' + Math.round(s.coverage * 100) + '% coverage, missing ' + (s.missing.join('/') || 'none')) : 'not built' };
  try {
    const t = await window.claude.complete({ system: `You are the Saltline Advisor inside a SaaS suite that prepares environmental dossiers clients take to regulators or major environmental consultancies. Products: ${C.PRODUCTS.map(p => p.name + ' — ' + p.short).join(' | ')}. Steer the client to the best product and the next concrete action. Plain language, under 120 words. Refer to pages by name: Products, Onboarding, Intake, Dossier builder. Never invent regulatory requirements; suggest confirming specifics with their regulator. Current state: ${JSON.stringify(state)}`, messages: S.chat.slice(-10).map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t })), max_tokens: 400 });
    S.chat.push({ r: 'a', t: t.trim() });
  } catch (e) { S.chat.push({ r: 'a', t: 'Sorry, I could not answer: ' + e.message }); }
  save(); renderChat();
}
$('#advF').onsubmit = e => { e.preventDefault(); const v = $('#advI').value; $('#advI').value = ''; ask(v); };
window.suite = { S, runIngest, buildIt, get ING() { return ING; } };
route();
</script>
